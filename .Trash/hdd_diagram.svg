<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <!-- Title -->
  <text x="300" y="30" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">硬盘驱动器 (HDD) 结构示意图</text>

  <!-- HDD Case Outline -->
  <rect x="50" y="50" width="500" height="350" rx="15" ry="15" fill="#e0e0e0" stroke="#555" stroke-width="3" />

  <!-- Platter (盘片) -->
  <circle cx="220" cy="225" r="140" fill="#dcdcdc" stroke="#999" stroke-width="2" />
  <!-- Platter Reflection/Sheen -->
  <circle cx="220" cy="225" r="130" fill="none" stroke="#f0f0f0" stroke-width="1" opacity="0.5" />
  <path d="M 220 85 A 140 140 0 0 1 360 225" fill="none" stroke="white" stroke-width="2" opacity="0.6" />

  <!-- Spindle (主轴) -->
  <circle cx="220" cy="225" r="25" fill="#333" stroke="#000" stroke-width="2" />
  <circle cx="220" cy="225" r="10" fill="#777" />
  <text x="220" y="265" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Spindle (主轴)</text>

  <!-- Actuator Axis (传动轴/枢轴) -->
  <circle cx="450" cy="300" r="12" fill="#333" stroke="#000" stroke-width="2" />
  
  <!-- Actuator Arm (机械臂) -->
  <path d="M 450 300 L 160 225 L 170 205 L 450 280 Z" fill="#a0a0a0" stroke="#555" stroke-width="1" />
  
  <!-- Read/Write Head (磁头) -->
  <rect x="155" y="215" width="15" height="10" fill="#000" />
  <line x1="162" y1="215" x2="162" y2="150" stroke="#333" stroke-width="1" stroke-dasharray="4" />
  <text x="162" y="145" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#d9534f" font-weight="bold">Head (磁头)</text>

  <!-- Voice Coil Motor (音圈电机) -->
  <path d="M 450 300 Q 520 250 510 350 Q 480 370 450 300" fill="#f0ad4e" stroke="#d68e09" stroke-width="2" />
  <text x="535" y="340" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">VCM (音圈电机)</text>
  <line x1="500" y1="330" x2="535" y2="330" stroke="#333" stroke-width="1" />

  <!-- Interface Connector (接口) -->
  <rect x="520" y="100" width="30" height="80" fill="#333" />
  <text x="480" y="140" font-family="sans-serif" font-size="12" fill="#333">Interface (接口)</text>
  <line x1="520" y1="140" x2="510" y2="140" stroke="#333" stroke-width="1" />

  <!-- Platter Label -->
  <text x="100" y="100" font-family="sans-serif" font-size="14" fill="#0275d8" font-weight="bold">Platter (盘片)</text>
  <line x1="130" y1="110" x2="180" y2="150" stroke="#0275d8" stroke-width="1" />

  <!-- Actuator Arm Label -->
  <text x="350" y="180" font-family="sans-serif" font-size="14" fill="#5cb85c" font-weight="bold">Actuator Arm (机械臂)</text>
  <line x1="380" y1="190" x2="350" y2="240" stroke="#5cb85c" stroke-width="1" />

</svg>